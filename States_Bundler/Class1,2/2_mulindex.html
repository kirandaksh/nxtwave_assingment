<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>states</title>
    <!--React, is an algo that manipulates the UI-->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <!--React DOM, is a support that actually support react-->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!--Babel, transpiler , where this devices JS and HTML from JSX-->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .counter{
            border-bottom: 2px solid black;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
   <div id="root"></div> 
   <script type="text/babel">
      function Counter(props){
        console.log(props);
        const {index, value} = props; //destructuring the props object, so that we can use the index and value in our code.
        const [count, setCount] = React.useState(value); //this line excutes only one time  
        //count =  value  
        
        const increment = () => {
            console.log("inc");//when ever this function is invoked then in console we print  the that this functions is actually called.                
            setCount(count+1);//setCount is actually increment the state var count 
        }
        const decrement = () => {
            console.log("decrement");
            setCount(count-1);
        }
        return <div className="counter">
                <h2>Counter Number: {index}</h2>
                <button onClick={increment}>+</button>
                <span>{count}</span>
                <button onClick={decrement}>-</button>
            </div>
      }

        function CounterParent(){//we use these small component to make it very large 
            return <div>
                   <Counter index={1} value = {0}></Counter>{/*I want the value to be 0 as initial value of counter*/}
                   <Counter index={2} value = {5}></Counter>{/*I want the value to be 5 as initial value of counter*/}
                   <Counter index={3} value = {10}></Counter>{/*I want the value to be 10 as initial value of counter*/}
                </div>
        }
        
        ReactDOM.render(<CounterParent></CounterParent>, document.getElementById('root'));
   </script>
</body>
</html>

<!--
1. usecases of state wrt to a component: to make it dynamic 
2. we create complex component by using multiple independent component. 
3. props: to pass data to a children component, majority the specific to component.
-->
