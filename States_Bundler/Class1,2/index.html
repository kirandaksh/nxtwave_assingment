<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>states bundler</title>
    <!--React, is an algo that manipulates the UI-->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <!--React DOM, is a support that actually support react-->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!--Babel, transpiler , where this devices JS and HTML from JSX-->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .counter{
            border: 4px solid black;
            padding: 10rem;
        }
        .count{
            margin: 30px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        //lets build a counter, where i have a + operator to increase the value in counter 
        //whereas, button should reduce the value in counter
        //In react we can items using the states, as react follows the state variable
        //useState by default returns  us array of state var as 1st arguments , and 
        //it give ssetterfunction that helps to update the state variable 
        function Counter(){
            //const count = React.useState(0);
            //useState(0) => 0  is a initial value of that state variable
            const [count, setCount] = React.useState(0); //this line excutes only one time 
            //after that it will not execute again, so this is the reason we are using useState
            //count = 0, is the state var , which is meant that count is overview by react algo. 
            const increment = () => {
                console.log("inc");//when ever this function is invoked then in console we print  the that this functions is actually called.                
                setCount(count+1);//setCount is actually increment the state var count 
                //setCount() actually updates the value of state var, count, after update 
                //this count value is  changed from 0 to the new value.
            }
            const decrement = () => {
                console.log("decrement");
                setCount(count-1);
            }
            return <div className="counter">
                    <button onClick={increment}>+</button>
                    <span className="count">{count}</span>
                    <button onClick={decrement}>-</button>
                </div>
        }
        
        ReactDOM.render(<Counter></Counter>, document.getElementById('root'));
    </script>
</body>
</html>

 1. When ever you are building anything in React, built it in static website form 
-->
