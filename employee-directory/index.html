<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Directory</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header>
  <h1>Employee Directory</h1>
  <input type="text" id="search" placeholder="Search by name or email">
  <select id="sort">
    <option value="">Sort By</option>
    <option value="firstName">First Name</option>
    <option value="department">Department</option>
  </select>
  <select id="pageSize">
    <option value="4">4</option>
    <option value="8">8</option>
    <option value="16">16</option>
  </select>
  <button onclick="showForm()">Add Employee</button>
</header>

  <div id="filter-panel" class="filter">
    <h3>Filter Employees</h3>
    <input id="filter-name" placeholder="First Name">
    <input id="filter-dept" placeholder="Department">
    <input id="filter-role" placeholder="Role">
    <button onclick="applyFilter()">Apply</button>
    <button onclick="clearFilter()">Clear</button>
  </div>

<div id="employee-list"></div>

<div id="pagination"></div>

<div class="modal" id="employee-modal">
  <h2 id="modal-title">Add Employee</h2>
  <input id="firstName" placeholder="First Name"><br>
  <input id="lastName" placeholder="Last Name"><br>
  <input id="email" placeholder="Email"><br>
  <input id="department" placeholder="Department"><br>
  <input id="role" placeholder="Role"><br>
  <button onclick="saveEmployee()">Save</button>
  <button onclick="closeForm()">Cancel</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
